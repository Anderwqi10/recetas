services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/recetas.db
      OPENROUTER_REFERER: http://localhost:8000
    volumes:
      - recetas_data:/app/data
    restart: unless-stopped

volumes:
  recetas_data:
